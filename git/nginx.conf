# tofu-cache-git: fronts git-cgi.sh (via fcgiwrap) for anonymous clones of public
# GitHub repos. Runs as uid 101 on plain http :8080 behind Caddy.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  log_format git '$status $body_bytes_sent $request_method "$request_uri" $request_time';
  access_log /dev/stdout git;
  server_tokens off;

  server {
    listen 8080;
    server_name _;

    # Answered by nginx so busy git workers can't make it hang; the entrypoint exits
    # (and the container restarts) if fcgiwrap dies.
    location = /healthz { access_log off; return 200 "ok\n"; }

    # $uri is already decoded and normalised; the CGI re-validates every segment.
    location ~ ^/repository/git(?<git_path>/github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/(?:info/refs|git-upload-pack))$ {
      gzip off;
      client_max_body_size 10m;
      fastcgi_buffering off;
      # A cold clone may wait 330s for another clone's lock, then clone for up to 300s
      # (GIT_CACHE_CLONE_SECONDS default); raise this with it.
      fastcgi_read_timeout 660s;
      include fastcgi_params;
      fastcgi_pass unix:/tmp/fcgiwrap.sock;
      fastcgi_param SCRIPT_FILENAME /usr/local/bin/git-cgi.sh;
      fastcgi_param PATH_INFO $git_path;
      fastcgi_param GIT_PROTOCOL $http_git_protocol;
    }

    location / { return 404; }
  }
}
