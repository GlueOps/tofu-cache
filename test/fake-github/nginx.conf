events {}
http {
  access_log /dev/stdout;
  error_log /dev/stderr;
  server {
    listen 8080;
    client_max_body_size 10m;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/local/bin/fake-github.sh;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param GIT_PROTOCOL $http_git_protocol;
    location /acme/big.git/ {
      limit_rate 64k;
      fastcgi_pass unix:/tmp/fcgiwrap.sock;
    }
    location / {
      fastcgi_pass unix:/tmp/fcgiwrap.sock;
    }
  }
}
