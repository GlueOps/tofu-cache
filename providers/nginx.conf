# tofu-cache-providers: caches the providers.v1 API of registry.opentofu.org and
# registry.terraform.io and the release files they point at. Runs as uid 101 on
# plain http :8080 behind Caddy, which terminates TLS and strips client credentials.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  log_format tofu '$status $upstream_cache_status $body_bytes_sent "$request_uri"'
                  ' [$upstream_status] $request_time';
  access_log /dev/stdout tofu;
  server_tokens off;

  # Docker's embedded DNS. Every proxy_pass below uses a variable, so names are
  # resolved per request and nginx starts even when DNS or the internet is down.
  # A records only: compose networks usually have no IPv6 route.
  resolver 127.0.0.11 ipv6=off valid=30s;
  resolver_timeout 5s;

  # Unused for 60 days -> evicted; over max_size -> least recently used goes first.
  proxy_cache_path /cache/api levels=1:2 keys_zone=tofu_api:16m
                   max_size=1g min_free=2g inactive=60d use_temp_path=off;
  proxy_cache_path /cache/dl  levels=1:2 keys_zone=tofu_dl:16m
                   max_size=10g min_free=5g inactive=60d use_temp_path=off;

  # No $host: regional and global hostnames share one cache. Safe because the
  # rewritten download URLs are relative. Query strings are never forwarded.
  proxy_cache_key $uri;
  proxy_cache_lock on;
  proxy_cache_lock_timeout 120s;   # aws is ~150MB; later requests wait for the first fill
  proxy_cache_lock_age 120s;
  proxy_cache_background_update on;
  proxy_cache_revalidate on;
  proxy_cache_use_stale error timeout invalid_header updating
                        http_500 http_502 http_503 http_504 http_429 http_403;
  proxy_ignore_headers Cache-Control Expires Set-Cookie Vary
                       X-Accel-Expires X-Accel-Redirect X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
  proxy_hide_header Set-Cookie;

  proxy_http_version 1.1;
  # Every proxy_set_header must live here: one inside a location silently drops
  # all of these for that location (Accept-Encoding would then defeat sub_filter).
  proxy_set_header Host $proxy_host;
  proxy_set_header Authorization "";
  proxy_set_header Cookie "";
  proxy_set_header Accept-Encoding "";
  proxy_ssl_server_name on;
  proxy_ssl_protocols TLSv1.2 TLSv1.3;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 4;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_next_upstream error timeout;
  proxy_next_upstream_timeout 15s;

  # GitHub's 302 carries a ~1KB signed Location; the 4k default fails with
  # "upstream sent too big header".
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  proxy_max_temp_file_size 2048m;  # applies only to responses not being cached

  server {
    listen 8080;
    server_name _;
    recursive_error_pages on;      # redirect hop 2+; nginx caps the chain at 10
    add_header X-Cache-Status $upstream_cache_status always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # ---- providers.v1 API: only the two endpoints a provider install calls ----
    # Version list: changes on every provider release, so short; stale while refreshing.
    location ~ ^/repository/tofu/(?<reg>registry\.opentofu\.org|registry\.terraform\.io)(?<api>/v1/providers/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/versions)$ {
      proxy_pass https://$reg$api;
      proxy_cache tofu_api;
      proxy_cache_valid 200 2m;
      proxy_cache_valid 404 1m;
    }
    # Per-version download JSON: effectively immutable; 1d so a registry re-pointing
    # URLs is picked up. Served stale while upstream is down.
    location ~ ^/repository/tofu/(?<reg>registry\.opentofu\.org|registry\.terraform\.io)(?<api>/v1/providers/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/[A-Za-z0-9._+-]+/download/[a-z0-9]+/[a-z0-9_]+)$ {
      proxy_pass https://$reg$api;
      proxy_cache tofu_api;
      proxy_cache_valid 200 1d;
      proxy_cache_valid 404 1m;
      # Relative URLs resolve against the providers.v1 URL, so one cached body
      # serves every mirror hostname. registry.opentofu.org sends its JSON as
      # application/octet-stream. signing_keys pass through untouched.
      sub_filter_types application/json application/octet-stream;
      sub_filter_once off;
      sub_filter '"https://github.com/' '"/repository/tofu/dl/github/';
      sub_filter '"https://releases.hashicorp.com/' '"/repository/tofu/dl/hashicorp/';
    }

    # ---- release files: immutable by name; no sub_filter here ----
    # Only provider release files (terraform-provider-*, as every registry download
    # JSON names them), so the public mirror can't serve arbitrary GitHub release
    # assets. The repo name is not checked: a renamed-repo redirect may change it.
    location ~ ^/repository/tofu/dl/github(?<p>/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/download/[A-Za-z0-9._+~-]+/terraform-provider-[A-Za-z0-9._+~-]+)$ {
      proxy_pass https://github.com$p;
      proxy_cache tofu_dl;
      proxy_cache_valid 200 365d;
      proxy_intercept_errors on;
      error_page 301 302 303 307 308 = @dl_follow;
    }
    location ~ ^/repository/tofu/dl/hashicorp(?<p>/terraform-provider-[A-Za-z0-9_-]+/[A-Za-z0-9._+~-]+/terraform-provider-[A-Za-z0-9._+~-]+)$ {
      proxy_pass https://releases.hashicorp.com$p;
      proxy_cache tofu_dl;
      proxy_cache_valid 200 365d;
      proxy_intercept_errors on;
      error_page 301 302 303 307 308 = @dl_follow;
    }

    # Follows redirects server-side and caches under the original $uri (signed CDN
    # URLs expire). Every hop is checked: GitHub's asset CDNs, a renamed-repo hop to
    # another github.com release path, or releases.hashicorp.com. An `if`, not a
    # `map`: a map is evaluated once per request and would reuse hop 1's verdict.
    location @dl_follow {
      internal;
      set $dl_target $upstream_http_location;
      if ($dl_target !~ "^https://(?:(?:release-assets|objects)\.githubusercontent\.com/|github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/download/[^/]+/terraform-provider-|releases\.hashicorp\.com/terraform-provider-)") {
        return 502;
      }
      proxy_pass $dl_target;
      proxy_cache tofu_dl;
      proxy_cache_valid 200 365d;
      proxy_intercept_errors on;
      error_page 301 302 303 307 308 = @dl_follow;
    }

    location / { return 404; }
  }
}
